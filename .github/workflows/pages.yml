name: Publish REAKT website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir -p _site
          sed 's#../assets/#assets/#g' web/index.html > _site/index.html
          cp _site/index.html _site/REAKT_webv2.html
          cp -R assets _site/assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('web/manifest.webmanifest').read_text())
          manifest['start_url'] = './'
          for icon in manifest.get('icons', []):
              icon['src'] = icon['src'].replace('../assets/', 'assets/')
          Path('_site/manifest.webmanifest').write_text(json.dumps(manifest))
          Path('_site/.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
